[package]
name = "chronos-performance"
version = "0.1.0"
edition = "2021"
description = "Performance benchmarks for Chronos event store"
publish = false

[[bin]]
name = "perf-bench"
path = "src/main.rs"

[dependencies]
allsource-core = { path = "../../apps/core" }
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
