[package]
name = "allsource-inspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "CLI tool for inspecting AllSource Core WAL and Parquet storage files"
publish = false

[[bin]]
name = "allsource-inspect"
path = "src/main.rs"

[dependencies]
allsource-core = { workspace = true, default-features = false, features = ["embedded"] }
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7"
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
