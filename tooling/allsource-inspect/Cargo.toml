[package]
name = "allsource-inspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "CLI tool for inspecting AllSource Core WAL and Parquet storage files"
publish = false

[[bin]]
name = "allsource-inspect"
path = "src/main.rs"

[dependencies]
allsource-core = { path = "../../apps/core", default-features = false, features = ["embedded"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
