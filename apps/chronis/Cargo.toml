[package]
name = "chronis"
version = "0.1.0"
edition = "2024"
description = "Event-sourced task CLI powered by AllSource Core"
license = "MIT"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://all-source-os.github.io/all-source/chronis/"
keywords = ["cli", "task", "event-sourcing", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "chronis"
path = "src/lib.rs"

[[bin]]
name = "cn"
path = "src/main.rs"

[dependencies]
allsource-core = { version = "0.13.1", path = "../core", default-features = false, features = [
    "embedded",
    "embedded-replicant",
    "embedded-projections",
] }
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dashmap = "6.1"
rand = "0.10"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.17"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23"
