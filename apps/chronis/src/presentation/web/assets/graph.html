<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chronis — dependency graph</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js"></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <div class="container">
    <header>
      <h1>chronis</h1>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/kanban">Kanban</a>
        <a href="/graph" class="active">Graph</a>
        <a href="/tree">Tree</a>
      </nav>
      <div class="stats-bar"
           hx-get="/partials/stats"
           hx-trigger="load, refresh from:body, every 30s"
           hx-swap="innerHTML">
      </div>
    </header>

    <div style="display: grid; grid-template-columns: 1fr 380px; gap: 16px;">
      <div class="graph-container"
           hx-get="/partials/graph"
           hx-trigger="load, refresh from:body, every 30s"
           hx-swap="innerHTML">
      </div>

      <div class="panel" id="detail-pane">
        <p class="empty-state">Click a node to see details</p>
      </div>
    </div>
  </div>
  <script>
    // Live reload via SSE
    (function () {
      function connect() {
        var es = new EventSource('/events/stream');
        es.onmessage = function () {
          htmx.trigger(document.body, 'refresh');
        };
        es.onerror = function () {
          es.close();
          setTimeout(connect, 1000);
        };
      }
      connect();
    })();
  </script>
</body>
</html>
