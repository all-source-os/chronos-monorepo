<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chronis — dependency graph</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js"></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <div class="container">
    <header>
      <h1>chronis</h1>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/kanban">Kanban</a>
        <a href="/graph" class="active">Graph</a>
      </nav>
      <div class="stats-bar"
           hx-get="/partials/stats"
           hx-trigger="load, every 2s, refresh from:body"
           hx-swap="innerHTML">
      </div>
    </header>

    <div style="display: grid; grid-template-columns: 1fr 380px; gap: 16px;">
      <div class="graph-container"
           hx-get="/partials/graph"
           hx-trigger="load, every 2s, refresh from:body"
           hx-swap="innerHTML">
      </div>

      <div class="panel" id="detail-pane">
        <p class="empty-state">Click a node to see details</p>
      </div>
    </div>
  </div>
</body>
</html>
