<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chronis — dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js"></script>
  <script src="/detail-pane.js" defer></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <div class="container">
    <header>
      <h1>chronis</h1>
      <nav>
        <a href="/" class="active">Dashboard</a>
        <a href="/kanban">Kanban</a>
        <a href="/graph">Graph</a>
        <a href="/tree">Tree</a>
      </nav>
      <div class="stats-bar"
           hx-get="/partials/stats"
           hx-trigger="load, refresh from:body, every 30s"
           hx-swap="innerHTML">
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search tasks..."
               oninput="filterTasks()" autofocus>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" data-filter="open" onclick="setFilter('open')">Open</button>
        <button class="filter-btn" data-filter="in-progress" onclick="setFilter('in-progress')">In Progress</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
      </div>
      <a href="/api/export" class="export-btn" download>Export .md</a>
    </div>

    <div class="layout">
      <div class="panel" style="overflow: auto; max-height: calc(100vh - 220px);">
        <table>
          <thead>
            <tr>
              <th aria-sort="none" data-sort-key="id"><button type="button" class="sort-th" onclick="sortBy('id')">ID<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="type"><button type="button" class="sort-th" onclick="sortBy('type')">Type<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="title"><button type="button" class="sort-th" onclick="sortBy('title')">Title<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="pri"><button type="button" class="sort-th" onclick="sortBy('pri')">Pri<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="status"><button type="button" class="sort-th" onclick="sortBy('status')">Status<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="claimed"><button type="button" class="sort-th" onclick="sortBy('claimed')">Claimed<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th aria-sort="none" data-sort-key="blocked"><button type="button" class="sort-th" onclick="sortBy('blocked')">Blocked<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-list"
                 hx-get="/partials/task-list"
                 hx-trigger="load, refresh from:body, every 30s"
                 hx-swap="innerHTML">
          </tbody>
        </table>
      </div>

      <div class="panel" id="detail-pane" tabindex="-1" role="region" aria-label="Task detail">
        <p class="empty-state">Click a task to see details</p>
      </div>
    </div>

    <div class="shortcut-bar">
      <span><kbd class="kbd">/</kbd> search</span>
      <span><kbd class="kbd">1</kbd> open</span>
      <span><kbd class="kbd">2</kbd> in-progress</span>
      <span><kbd class="kbd">3</kbd> done</span>
      <span><kbd class="kbd">0</kbd> all</span>
      <span><kbd class="kbd">j</kbd><kbd class="kbd">k</kbd> navigate</span>
      <span><kbd class="kbd">Enter</kbd> detail</span>
      <span><kbd class="kbd">e</kbd> export</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentFilter = 'all';
    let selectedRow = -1;

    // ---- Sortable columns ---------------------------------------------------
    // Sort runs client-side over the rows already in the DOM. Because the
    // #task-list <tbody> is re-rendered every 30s and on every 'refresh' event,
    // we persist the active sort in localStorage and re-apply it after each
    // HTMX swap (see the htmx:afterSwap handler below).
    const SORT_KEY = 'chronis.dashboard.sort';

    // Semantic rank tables: lower number sorts first when ascending.
    const PRI_RANK = { p0: 0, p1: 1, p2: 2, p3: 3 };
    // Workflow order: in-progress first (active work), then open (queued),
    // then done (closed) — matches how an operator triages the board.
    const STATUS_RANK = { 'in-progress': 0, open: 1, done: 2 };
    const TYPE_RANK = { epic: 0, feature: 1, task: 2, bug: 3 };

    let activeSort = loadSort(); // { key, dir } | null

    function loadSort() {
      try {
        const raw = localStorage.getItem(SORT_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (s && s.key && (s.dir === 'asc' || s.dir === 'desc')) return s;
      } catch (_) {}
      return null;
    }

    function saveSort() {
      try {
        if (activeSort) localStorage.setItem(SORT_KEY, JSON.stringify(activeSort));
        else localStorage.removeItem(SORT_KEY);
      } catch (_) {}
    }

    // Build a comparable key for one row + column. Returns either a number
    // (semantic columns) or a lowercase string (natural columns).
    function sortValue(row, key) {
      const cells = row.children;
      switch (key) {
        case 'id':      return (cells[0].textContent || '').trim().toLowerCase();
        case 'type':    return TYPE_RANK[(row.dataset.type || '').toLowerCase()] ?? 99;
        case 'title':   return (cells[2].textContent || '').trim().toLowerCase();
        case 'pri':     return PRI_RANK[(row.dataset.pri || '').toLowerCase()] ?? 99;
        case 'status':  return STATUS_RANK[(row.dataset.status || '').toLowerCase()] ?? 99;
        case 'claimed': return (cells[5].textContent || '').trim().toLowerCase();
        // blocked: blocked rows (data-blocked="1") group apart from unblocked.
        case 'blocked': return row.dataset.blocked === '1' ? 0 : 1;
        default:        return '';
      }
    }

    function applySort() {
      if (!activeSort) return;
      const tbody = document.getElementById('task-list');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('.task-row'));
      if (rows.length === 0) return;

      const { key, dir } = activeSort;
      const factor = dir === 'desc' ? -1 : 1;
      // Stable sort with a decorated index tiebreaker so equal keys keep their
      // server order.
      rows.map((row, i) => [row, i]).sort((a, b) => {
        const av = sortValue(a[0], key);
        const bv = sortValue(b[0], key);
        let cmp;
        if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
        else cmp = String(av).localeCompare(String(bv), undefined, { numeric: true });
        if (cmp !== 0) return cmp * factor;
        return a[1] - b[1];
      }).forEach(([row]) => tbody.appendChild(row));
    }

    function updateSortIndicators() {
      document.querySelectorAll('th[data-sort-key]').forEach(th => {
        const indicator = th.querySelector('.sort-indicator');
        if (activeSort && th.dataset.sortKey === activeSort.key) {
          th.setAttribute('aria-sort', activeSort.dir === 'desc' ? 'descending' : 'ascending');
          if (indicator) indicator.textContent = activeSort.dir === 'desc' ? '▼' : '▲';
        } else {
          th.setAttribute('aria-sort', 'none');
          if (indicator) indicator.textContent = '';
        }
      });
    }

    function sortBy(key) {
      // Cycle: asc -> desc -> asc (no unsorted state, per spec).
      if (activeSort && activeSort.key === key) {
        activeSort = { key, dir: activeSort.dir === 'asc' ? 'desc' : 'asc' };
      } else {
        activeSort = { key, dir: 'asc' };
      }
      saveSort();
      updateSortIndicators();
      applySort();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      filterTasks();
    }

    function filterTasks() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#task-list .task-row');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        const status = row.dataset.status || '';
        const matchSearch = !query || text.includes(query);
        const matchFilter = currentFilter === 'all' || status === currentFilter;
        row.style.display = matchSearch && matchFilter ? '' : 'none';
      });
      selectedRow = -1;
    }

    function getVisibleRows() {
      return Array.from(document.querySelectorAll('#task-list .task-row')).filter(r => r.style.display !== 'none');
    }

    function selectRow(index) {
      const rows = getVisibleRows();
      rows.forEach(r => r.classList.remove('selected'));
      if (index >= 0 && index < rows.length) {
        selectedRow = index;
        rows[index].classList.add('selected');
        rows[index].scrollIntoView({ block: 'nearest' });
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.addEventListener('keydown', function(e) {
      const searchInput = document.getElementById('search-input');
      const isSearchFocused = document.activeElement === searchInput;

      if (e.key === '/' && !isSearchFocused) {
        e.preventDefault();
        searchInput.focus();
        return;
      }

      if (e.key === 'Escape' && isSearchFocused) {
        searchInput.blur();
        searchInput.value = '';
        filterTasks();
        return;
      }

      if (isSearchFocused) return;

      switch (e.key) {
        case 'j': selectRow(selectedRow + 1); break;
        case 'k': selectRow(Math.max(0, selectedRow - 1)); break;
        case 'Enter': {
          const rows = getVisibleRows();
          if (selectedRow >= 0 && selectedRow < rows.length) rows[selectedRow].click();
          break;
        }
        case '1': setFilter('open'); break;
        case '2': setFilter('in-progress'); break;
        case '3': setFilter('done'); break;
        case '0': setFilter('all'); break;
        case 'e': window.location.href = '/api/export'; break;
      }
    });

    // Re-apply filter + sort after HTMX swaps. The task-list <tbody> re-renders
    // every 30s and on every 'refresh' event, which would otherwise wipe a
    // client-side sort — so we re-sort the freshly-swapped rows here. applySort
    // reorders the DOM nodes; filterTasks only toggles display, so order is
    // preserved and filtered-out rows are not un-hidden.
    document.body.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target.id === 'task-list') {
        applySort();
        filterTasks();
      }
    });

    // Restore the persisted sort indicators on initial page load (the rows
    // themselves are sorted by applySort once the first HTMX swap lands).
    updateSortIndicators();

    // Live reload via SSE: when the backend signals a change, dispatch a
    // 'refresh' event on body, which htmx partials listen for via
    // hx-trigger="refresh from:body". Reconnects automatically on drop.
    (function () {
      function connect() {
        var es = new EventSource('/events/stream');
        es.onmessage = function () {
          htmx.trigger(document.body, 'refresh');
        };
        es.onerror = function () {
          es.close();
          setTimeout(connect, 1000);
        };
      }
      connect();
    })();
  </script>
</body>
</html>
