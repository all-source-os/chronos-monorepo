# Standalone crate — intentionally excluded from the root Cargo workspace
# (see root Cargo.toml `exclude`). It depends on allsource-core from
# crates.io rather than a path so the embedded MCP Docker image can build
# from the apps/mcp-server-elixir context without copying apps/core.
[package]
name = "core_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["embedded-toon", "embedded-sync"]
embedded-toon = []
embedded-sync = []

[dependencies]
allsource-core = { version = "0.20", features = [
    "embedded",
    "embedded-toon",
    "embedded-projections",
    "embedded-sync",
] }
rustler = "0.37"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
