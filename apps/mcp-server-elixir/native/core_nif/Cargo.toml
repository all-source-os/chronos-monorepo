[package]
name = "core_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["embedded-toon", "embedded-sync"]
embedded-toon = []
embedded-sync = []

[dependencies]
allsource-core = { path = "../../../core", features = ["embedded", "embedded-toon", "embedded-projections", "embedded-sync"] }
rustler = "0.37"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
