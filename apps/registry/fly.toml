app = "allsource-registry"
primary_region = "iad"

[build]
  # Dockerfile path is relative to the fly.toml location
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "allsource_registry=info"
  REGISTRY_DATA_DIR = "/app/data/registry"

[http_service]
  internal_port = 3901
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "registry_data"
  destination = "/app/data"
