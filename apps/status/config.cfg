# AllSource Status Page
# Powered by Vigil (https://github.com/valeriansaliou/vigil)
# Monitors all production services on Fly.io + Vercel

[server]

log_level = "warn"
inet = "0.0.0.0:8080"
workers = 2

manager_token = "${VIGIL_MANAGER_TOKEN}"
reporter_token = "${VIGIL_REPORTER_TOKEN}"

[assets]

path = "./res/assets/"

[branding]

page_title = "AllSource Status"
page_url = "https://status.all-source.xyz/"
company_name = "AllSource"
icon_color = "#6366f1"
icon_url = "https://all-source.xyz/favicon.ico"
logo_color = "#6366f1"
logo_url = "https://all-source.xyz/favicon.ico"
website_url = "https://all-source.xyz/"
support_url = "mailto:support@all-source.xyz"
custom_html = ""

[metrics]

poll_interval = 60
poll_retry = 2
poll_retry_wait = 1000

poll_http_status_healthy_above = 200
poll_http_status_healthy_below = 400

poll_delay_dead = 10
poll_delay_sick = 5

poll_parallelism = 4

script_interval = 300
script_parallelism = 2

local_delay_dead = 40

[notify]

startup_notification = true
reminder_interval = 300

# Uncomment and configure when ready:
#
# [notify.slack]
# hook_url = "${SLACK_WEBHOOK_URL}"
#
# [notify.webhook]
# hook_url = "${ALERT_WEBHOOK_URL}"

# --- Probe definitions ---

# API Gateway (Control Plane) — the public entry point at api.all-source.xyz
[[probe.service]]

id = "api-gateway"
label = "API Gateway"

[[probe.service.node]]

id = "control-plane"
label = "Control Plane"
mode = "poll"
replicas = ["https://api.all-source.xyz/health"]

[[probe.service.node]]

id = "x402-routes"
label = "x402 Route Discovery"
mode = "poll"
replicas = ["https://api.all-source.xyz/x402/routes"]

# Core Event Store — checked via Control Plane's own /health response,
# which embeds a `core_status` field sourced from its internal probe of
# Core. Using /api/v1/health/core directly would require auth (Vigil
# can't present a service JWT), and Core is internal-only since bead
# t-0ff8 so there's no public Core hostname to hit either.
[[probe.service]]

id = "core"
label = "Core Event Store"

[[probe.service.node]]

id = "core-health"
label = "Core Health"
mode = "poll"
replicas = ["https://api.all-source.xyz/health"]
http_body_healthy_match = "\"core_status\":\"healthy\""

# Query Service — the Elixir API gateway for events, billing, WebSocket
[[probe.service]]

id = "query-service"
label = "Query Service"

[[probe.service.node]]

id = "query-health"
label = "Query Service Health"
mode = "poll"
replicas = ["https://allsource-query.fly.dev/health"]

# Web Frontend — marketing site + dashboard on Vercel
[[probe.service]]

id = "web"
label = "Web Frontend"

[[probe.service.node]]

id = "vercel"
label = "Website (Vercel)"
mode = "poll"
replicas = ["https://all-source.xyz/"]

# Supporting Services — auth, prime, registry
[[probe.service]]

id = "supporting"
label = "Supporting Services"

[[probe.service.node]]

id = "auth"
label = "Auth Service"
mode = "poll"
replicas = ["https://allsource-auth.fly.dev/health"]

[[probe.service.node]]

id = "prime"
label = "Prime (Graph/Vector)"
mode = "poll"
replicas = ["https://allsource-prime.fly.dev/health"]

[[probe.service.node]]

id = "registry"
label = "Registry"
mode = "poll"
replicas = ["https://allsource-registry.fly.dev/health"]
