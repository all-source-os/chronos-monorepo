<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chronon — dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js"></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <div class="container">
    <header>
      <h1>chronon</h1>
      <nav>
        <a href="/" class="active">Dashboard</a>
        <a href="/kanban">Kanban</a>
      </nav>
    </header>

    <div class="layout">
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Pri</th>
              <th>Status</th>
              <th>Claimed</th>
              <th>Blocked</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-list"
                 hx-get="/partials/task-list"
                 hx-trigger="load, every 2s, refresh from:body"
                 hx-swap="innerHTML">
          </tbody>
        </table>
      </div>

      <div class="panel" id="detail-pane">
        <p class="empty-state">Click a task to see details</p>
      </div>
    </div>
  </div>
</body>
</html>
