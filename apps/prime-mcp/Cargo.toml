[package]
name = "allsource-prime"
version = "0.17.0"
edition = "2024"
rust-version = "1.92"
description = "MCP server for AllSource Prime — unified agent memory engine (stdio transport)"
license = "Apache-2.0"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
keywords = ["mcp", "agent-memory", "allsource", "prime", "mcp-server"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "allsource-prime"
path = "src/main.rs"

[dependencies]
allsource-core = { version = "0.17.0", path = "../../apps/core", default-features = false, features = ["prime-recall", "prime-vectors"] }
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
