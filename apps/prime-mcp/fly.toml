# Fly.io Configuration for AllSource Prime
# Deploy from monorepo root:
#   flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile
#
# First-time setup:
#   flyctl apps create allsource-prime
#   flyctl volumes create prime_data --size 1 --region iad --app allsource-prime
#   flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile

app = "allsource-prime"
primary_region = "iad"

# Build from repo root: flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile
[build]

[env]
  PRIME_MODE = "http"
  PRIME_PORT = "3905"
  PRIME_DATA_DIR = "/data"
  PRIME_LOG_LEVEL = "info"
  RUST_LOG = "allsource_prime=info,allsource_core=info"

[http_service]
  internal_port = 3905
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/health"

[mounts]
  source = "prime_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
