# Fly.io Configuration for AllSource Control Plane
# Deploy: flyctl deploy --app allsource-control-plane

app = "allsource-control-plane"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GIN_MODE = "release"
  PORT = "3901"
  CORE_SERVICE_URL = "http://allsource-core.internal:3900"

# Required secrets (set via flyctl secrets set):
# - JWT_SECRET: openssl rand -base64 32
# - LEMON_SQUEEZY_API_KEY: LemonSqueezy API key (sk_live_...)
# - LEMON_SQUEEZY_STORE_ID: LemonSqueezy store ID
# - LEMON_SQUEEZY_WEBHOOK_SECRET: HMAC secret for webhook verification
# - LEMON_SQUEEZY_VARIANT_MAP: JSON mapping tier names to variant IDs
#     Example: {"free":"<variant_id>","pro":"<variant_id>","team":"<variant_id>"}

[http_service]
  internal_port = 3901
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
