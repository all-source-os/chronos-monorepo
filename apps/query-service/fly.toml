# Fly.io Configuration for AllSource Query Service
# Deploy: flyctl deploy --app allsource-query
# Scale: flyctl scale count 3 --app allsource-query
# Secrets: flyctl secrets set SECRET_KEY_BASE=... GOOGLE_CLIENT_ID=... etc

app = "allsource-query"
primary_region = "iad"  # US East (Virginia)

[build]
  dockerfile = "Dockerfile"

[env]
  MIX_ENV = "prod"
  PHX_HOST = "allsource-query.fly.dev"
  CORE_URL = "http://allsource-core.internal:3900"
  CORE_WS_URL = "ws://allsource-core.internal:3900/api/v1/events/stream"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  PORT = "3902"
  LOGGER_LEVEL = "info"

# Required secrets (set via flyctl secrets set):
# - SECRET_KEY_BASE: mix phx.gen.secret
# - GOOGLE_CLIENT_ID: from Google Cloud Console
# - GOOGLE_CLIENT_SECRET: from Google Cloud Console
# - GITHUB_CLIENT_ID: from GitHub Developer Settings
# - GITHUB_CLIENT_SECRET: from GitHub Developer Settings
# - LEMON_SQUEEZY_API_KEY: from LemonSqueezy dashboard
# - LEMON_SQUEEZY_STORE_ID: from LemonSqueezy dashboard
# - LEMON_SQUEEZY_WEBHOOK_SECRET: from LemonSqueezy webhook settings

[http_service]
  internal_port = 3902
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

  # Readiness check - determines if instance should receive traffic
  # Returns 503 when database or backend is unavailable
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health/ready"
    timeout = "5s"

  # Liveness check - determines if instance needs restart
  # Only fails if Elixir process cannot respond
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health/live"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Increased for production workload

[metrics]
  port = 9091
  path = "/metrics"
