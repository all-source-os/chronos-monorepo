# Fly.io Configuration for AllSource Web
# Deploy: flyctl deploy --app allsource-web
# Build from monorepo root: fly deploy -c apps/web/fly.toml --dockerfile apps/web/Dockerfile

app = "allsource-web"
primary_region = "iad"  # US East (Virginia)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"
  # API URL for client-side requests (public)
  NEXT_PUBLIC_API_URL = "https://allsource-query.fly.dev"
  # WebSocket URL — direct to QS (bypasses Next.js, which can't upgrade WS)
  NEXT_PUBLIC_WS_URL = "wss://allsource-query.fly.dev"
  # Control Plane — handles auth (OAuth, login, register, demo), tenant ops, billing
  CONTROL_PLANE_INTERNAL_URL = "http://allsource-control-plane.internal:3901"

# Required secrets (set via flyctl secrets set):
# None required for basic operation
# Optional:
# - NEXT_PUBLIC_POSTHOG_KEY: for analytics
# - NEXT_PUBLIC_POSTHOG_HOST: for analytics

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Static assets caching
[[statics]]
  guest_path = "/app/apps/web/public"
  url_prefix = "/public"
