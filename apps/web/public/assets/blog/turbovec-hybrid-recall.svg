<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8b96"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#0b0b10"/>
  <text x="50" y="50" fill="#f4f4f5" font-size="26" font-weight="700">Hybrid recall — kNN is only one signal</text>
  <text x="50" y="78" fill="#a1a1aa" font-size="15">Prime over-fetches, then re-ranks with structure. turbovec contributes the filtered candidate set.</text>

  <!-- query -->
  <rect x="50" y="180" width="150" height="64" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="125" y="212" fill="#e4e4e7" font-size="16" text-anchor="middle" font-weight="600">query</text>
  <text x="125" y="232" fill="#71717a" font-size="12.5" text-anchor="middle">+ allowlist filter</text>

  <!-- three lanes -->
  <rect x="290" y="100" width="240" height="64" rx="10" fill="#1c1408" stroke="#92400e"/>
  <text x="310" y="128" fill="#fcd34d" font-size="15" font-weight="600">vector similarity</text>
  <text x="310" y="150" fill="#a1a1aa" font-size="12.5">cosine kNN · over-fetch ×2 (turbovec lane)</text>

  <rect x="290" y="180" width="240" height="64" rx="10" fill="#0f1714" stroke="#065f46"/>
  <text x="310" y="208" fill="#6ee7b7" font-size="15" font-weight="600">graph proximity</text>
  <text x="310" y="230" fill="#a1a1aa" font-size="12.5">BFS from seeds · 1/(1+depth) decay</text>

  <rect x="290" y="260" width="240" height="64" rx="10" fill="#0f1714" stroke="#065f46"/>
  <text x="310" y="288" fill="#6ee7b7" font-size="15" font-weight="600">temporal recency</text>
  <text x="310" y="310" fill="#a1a1aa" font-size="12.5">exp decay from updated_at</text>

  <!-- weighted sum -->
  <rect x="620" y="180" width="170" height="64" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="705" y="206" fill="#e4e4e7" font-size="15" text-anchor="middle" font-weight="600">weighted sum</text>
  <text x="705" y="228" fill="#71717a" font-size="11.5" text-anchor="middle">w₁·cos + w₂·prox + w₃·rec</text>

  <!-- ranked -->
  <rect x="850" y="180" width="120" height="64" rx="10" fill="#0f1714" stroke="#065f46"/>
  <text x="910" y="212" fill="#6ee7b7" font-size="15" text-anchor="middle" font-weight="600">ranked</text>
  <text x="910" y="232" fill="#71717a" font-size="12.5" text-anchor="middle">top-k</text>

  <!-- arrows -->
  <g stroke="#8b8b96" stroke-width="1.8">
    <line x1="200" y1="200" x2="288" y2="132" marker-end="url(#a)"/>
    <line x1="200" y1="212" x2="288" y2="212" marker-end="url(#a)"/>
    <line x1="200" y1="224" x2="288" y2="292" marker-end="url(#a)"/>
    <line x1="530" y1="132" x2="618" y2="200" marker-end="url(#a)"/>
    <line x1="530" y1="212" x2="618" y2="212" marker-end="url(#a)"/>
    <line x1="530" y1="292" x2="618" y2="224" marker-end="url(#a)"/>
    <line x1="790" y1="212" x2="848" y2="212" marker-end="url(#a)"/>
  </g>

  <text x="50" y="392" fill="#52525b" font-size="14">Best practice: over-fetch cheap candidates, re-rank with what kNN can't see — edges, time, ACLs.</text>
  <text x="50" y="416" fill="#52525b" font-size="14">turbovec does the allowlist filter inside the SIMD kernel — hybrid retrieval without over-fetching the whole corpus.</text>
</svg>
