<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="920" height="520" fill="#0b0b10"/>
  <text x="50" y="50" fill="#f4f4f5" font-size="26" font-weight="700">Quantized scan vs HNSW graph</text>
  <text x="50" y="78" fill="#a1a1aa" font-size="15">Two bets on the index layer. The right one depends on N, memory budget, and ingest pattern.</text>

  <!-- axes -->
  <line x1="110" y1="120" x2="110" y2="400" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="820" y2="400" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="100" y="130" fill="#71717a" font-size="13" text-anchor="end">query</text>
  <text x="100" y="146" fill="#71717a" font-size="13" text-anchor="end">latency</text>
  <text x="820" y="424" fill="#71717a" font-size="13" text-anchor="end">corpus size N  →</text>
  <text x="120" y="420" fill="#52525b" font-size="12">10K</text>
  <text x="780" y="420" fill="#52525b" font-size="12">100M</text>

  <!-- HNSW: flat-low latency (green) -->
  <path d="M110 360 C 300 348, 520 338, 820 330" fill="none" stroke="#34d399" stroke-width="3"/>
  <circle cx="820" cy="330" r="4" fill="#34d399"/>
  <text x="640" y="320" fill="#6ee7b7" font-size="15" font-weight="600">HNSW (Prime)</text>
  <text x="500" y="372" fill="#52525b" font-size="12.5">flat latency · but high RAM + rebuild cost</text>

  <!-- scan: grows with N (amber) -->
  <path d="M110 388 C 360 380, 560 330, 820 180" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="820" cy="180" r="4" fill="#fbbf24"/>
  <text x="610" y="170" fill="#fcd34d" font-size="15" font-weight="600">quantized scan (turbovec)</text>
  <text x="150" y="382" fill="#52525b" font-size="12.5">tiny RAM · online ingest · O(N) scan</text>

  <!-- crossover -->
  <line x1="560" y1="120" x2="560" y2="400" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 5"/>
  <circle cx="560" cy="333" r="5" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <text x="560" y="112" fill="#a1a1aa" font-size="13" text-anchor="middle">crossover</text>

  <!-- takeaways -->
  <rect x="110" y="438" width="345" height="58" rx="9" fill="#1c1408" stroke="#92400e"/>
  <text x="128" y="462" fill="#fcd34d" font-size="14" font-weight="600">Pick scan when:</text>
  <text x="128" y="484" fill="#a1a1aa" font-size="13">RAM-bound · constant ingest · N up to ~few M</text>

  <rect x="475" y="438" width="345" height="58" rx="9" fill="#0f1714" stroke="#065f46"/>
  <text x="493" y="462" fill="#6ee7b7" font-size="14" font-weight="600">Pick HNSW when:</text>
  <text x="493" y="484" fill="#a1a1aa" font-size="13">latency-bound · huge N · RAM available</text>

  <text x="50" y="116" fill="#52525b" font-size="12">conceptual — exact crossover varies by dim, bit width, hardware (AVX-512 helps scan)</text>
</svg>
