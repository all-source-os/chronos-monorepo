<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8b96"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#0b0b10"/>

  <!-- lifelines -->
  <g font-size="14" text-anchor="middle">
    <text x="110" y="40" fill="#e4e4e7" font-weight="600">Client</text>
    <text x="370" y="40" fill="#e4e4e7" font-weight="600">Control Plane</text>
    <text x="630" y="40" fill="#6ee7b7" font-weight="600">allsource-prime</text>
    <text x="890" y="40" fill="#e4e4e7" font-weight="600">Core</text>
  </g>
  <g stroke="#27272a" stroke-width="1.5">
    <line x1="110" y1="56" x2="110" y2="350"/>
    <line x1="370" y1="56" x2="370" y2="350"/>
    <line x1="630" y1="56" x2="630" y2="350"/>
    <line x1="890" y1="56" x2="890" y2="350"/>
  </g>

  <g font-size="12.5" fill="#cbd5e1">
    <line x1="110" y1="100" x2="370" y2="100" stroke="#8b8b96" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="240" y="92" text-anchor="middle">POST /prime/nodes (tenant key)</text>

    <line x1="370" y1="150" x2="630" y2="150" stroke="#8b8b96" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="500" y="142" text-anchor="middle" fill="#6ee7b7">+ X-Tenant-Id + PRIME_API_KEY</text>

    <line x1="630" y1="200" x2="890" y2="200" stroke="#8b8b96" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="760" y="192" text-anchor="middle">ingest prime.node.created (tenant-stamped)</text>

    <line x1="890" y1="250" x2="630" y2="250" stroke="#8b8b96" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="760" y="242" text-anchor="middle">on read: query prime.* WHERE tenant_id</text>

    <line x1="630" y1="300" x2="110" y2="300" stroke="#8b8b96" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="370" y="292" text-anchor="middle">fold → snapshot (other tenant's id → 404)</text>
  </g>

  <rect x="610" y="216" width="40" height="20" rx="4" fill="#0f1714" stroke="#065f46"/>
  <text x="630" y="231" font-size="11" fill="#6ee7b7" text-anchor="middle">fold</text>
</svg>
