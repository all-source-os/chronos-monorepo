<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c7c8a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="60" y="78" fill="#f4f4f5" font-size="40" font-weight="700">Prime is now stateless</text>
  <text x="60" y="116" fill="#a1a1aa" font-size="22">The hosted memory engine stopped being a second database. Core is the only store.</text>

  <!-- divider -->
  <line x1="600" y1="160" x2="600" y2="560" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- BEFORE -->
  <text x="60" y="192" fill="#f87171" font-size="20" font-weight="700">BEFORE</text>
  <text x="60" y="216" fill="#71717a" font-size="15">app = a second DB, one shared untenanted graph</text>

  <rect x="60" y="240" width="180" height="56" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="150" y="274" fill="#e4e4e7" font-size="16" text-anchor="middle">Control Plane</text>

  <rect x="60" y="338" width="300" height="92" rx="10" fill="#1c1117" stroke="#7f1d1d"/>
  <text x="210" y="372" fill="#fca5a5" font-size="17" font-weight="600" text-anchor="middle">allsource-prime</text>
  <text x="210" y="396" fill="#a1a1aa" font-size="14" text-anchor="middle">Prime::open(/data)</text>
  <text x="210" y="416" fill="#a1a1aa" font-size="14" text-anchor="middle">single shared graph · no isolation</text>

  <rect x="120" y="470" width="180" height="60" rx="10" fill="#0c0c10" stroke="#3f3f46"/>
  <text x="210" y="498" fill="#d4d4d8" font-size="15" text-anchor="middle">/data volume</text>
  <text x="210" y="518" fill="#71717a" font-size="13" text-anchor="middle">(its own WAL + Parquet)</text>

  <line x1="150" y1="296" x2="180" y2="338" stroke="#7c7c8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="210" y1="430" x2="210" y2="470" stroke="#7c7c8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- AFTER -->
  <text x="640" y="192" fill="#34d399" font-size="20" font-weight="700">AFTER</text>
  <text x="640" y="216" fill="#71717a" font-size="15">stateless reader · per-tenant · Core is truth</text>

  <rect x="640" y="240" width="300" height="56" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="790" y="266" fill="#e4e4e7" font-size="16" text-anchor="middle">Control Plane (edge)</text>
  <text x="790" y="286" fill="#34d399" font-size="13" text-anchor="middle">+ X-Tenant-Id + PRIME_API_KEY</text>

  <rect x="640" y="338" width="300" height="92" rx="10" fill="#0f1714" stroke="#065f46"/>
  <text x="790" y="372" fill="#6ee7b7" font-size="17" font-weight="600" text-anchor="middle">allsource-prime</text>
  <text x="790" y="396" fill="#a1a1aa" font-size="14" text-anchor="middle">HostedPrime · per-tenant warm cache</text>
  <text x="790" y="416" fill="#34d399" font-size="14" text-anchor="middle">NO durable store</text>

  <rect x="700" y="470" width="180" height="60" rx="10" fill="#0c0c10" stroke="#3f3f46"/>
  <text x="790" y="498" fill="#d4d4d8" font-size="15" text-anchor="middle">Core</text>
  <text x="790" y="518" fill="#71717a" font-size="13" text-anchor="middle">prime.* events · the only store</text>

  <line x1="790" y1="296" x2="790" y2="338" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="790" y1="430" x2="790" y2="470" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="804" y="456" fill="#34d399" font-size="12">HTTP, tenant-scoped</text>

  <text x="60" y="600" fill="#52525b" font-size="14">all.source · ADR-020 · verified in production: tenant A 200 · tenant B 404 · no-key 401</text>
</svg>
