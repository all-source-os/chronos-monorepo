<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a16207"/>
    </marker>
  </defs>
  <rect width="1100" height="360" fill="#0b0b10"/>
  <text x="50" y="50" fill="#f4f4f5" font-size="26" font-weight="700">TurboQuant — the encoding pipeline</text>
  <text x="50" y="78" fill="#a1a1aa" font-size="15">Separate magnitude from direction; rotate so coordinates follow a known distribution; quantize the direction.</text>

  <!-- input -->
  <rect x="40" y="130" width="120" height="80" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="100" y="166" fill="#e4e4e7" font-size="15" text-anchor="middle">f32 vector</text>
  <text x="100" y="188" fill="#71717a" font-size="13" text-anchor="middle">1536-dim</text>

  <!-- steps -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="190" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="254" y="150" fill="#fcd34d" font-size="14" font-weight="600">1 normalize</text>
    <text x="254" y="174" fill="#a1a1aa">store norm</text>
    <text x="254" y="192" fill="#a1a1aa">separately</text>

    <rect x="332" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="396" y="150" fill="#fcd34d" font-size="14" font-weight="600">2 rotate</text>
    <text x="396" y="174" fill="#a1a1aa">orthogonal →</text>
    <text x="396" y="192" fill="#a1a1aa">Beta dist.</text>

    <rect x="474" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="538" y="150" fill="#fcd34d" font-size="14" font-weight="600">3 calibrate</text>
    <text x="538" y="174" fill="#a1a1aa">fit shift/scale</text>
    <text x="538" y="192" fill="#a1a1aa">on 1st ingest</text>

    <rect x="616" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="680" y="150" fill="#fcd34d" font-size="14" font-weight="600">4 Lloyd-Max</text>
    <text x="680" y="174" fill="#a1a1aa">optimal 2/4-bit</text>
    <text x="680" y="192" fill="#a1a1aa">buckets</text>

    <rect x="758" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="822" y="150" fill="#fcd34d" font-size="14" font-weight="600">5 bit-pack</text>
    <text x="822" y="174" fill="#a1a1aa">dense bytes</text>
    <text x="822" y="192" fill="#a1a1aa">SIMD-ready</text>

    <rect x="900" y="120" width="128" height="100" rx="10" fill="#1c1408" stroke="#92400e"/>
    <text x="964" y="146" fill="#fcd34d" font-size="14" font-weight="600">6 renorm</text>
    <text x="964" y="170" fill="#a1a1aa">per-vec scalar</text>
    <text x="964" y="188" fill="#a1a1aa">debias score</text>
  </g>

  <!-- arrows -->
  <g stroke="#a16207" stroke-width="1.8">
    <line x1="162" y1="170" x2="188" y2="170" marker-end="url(#a)"/>
    <line x1="320" y1="170" x2="330" y2="170" marker-end="url(#a)"/>
    <line x1="462" y1="170" x2="472" y2="170" marker-end="url(#a)"/>
    <line x1="604" y1="170" x2="614" y2="170" marker-end="url(#a)"/>
    <line x1="746" y1="170" x2="756" y2="170" marker-end="url(#a)"/>
    <line x1="888" y1="170" x2="898" y2="170" marker-end="url(#a)"/>
  </g>

  <!-- output -->
  <rect x="430" y="262" width="240" height="58" rx="10" fill="#141414" stroke="#a16207"/>
  <text x="550" y="288" fill="#fcd34d" font-size="15" text-anchor="middle" font-weight="600">192 bytes (2-bit) · 384 bytes (4-bit)</text>
  <text x="550" y="308" fill="#71717a" font-size="13" text-anchor="middle">+ norm + correction scalar, stored apart</text>
  <line x1="964" y1="220" x2="664" y2="262" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 4"/>

  <text x="50" y="344" fill="#52525b" font-size="13.5">No training phase. No rebuild as the corpus grows — calibration is fit once, then ingest is online.</text>
</svg>
