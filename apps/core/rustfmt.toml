# Shared rustfmt configuration for all Rust projects
# Uses only stable rustfmt options for CI compatibility

edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"

# Import organization (stable)
reorder_imports = true
reorder_modules = true

# Formatting (stable)
remove_nested_parens = true
