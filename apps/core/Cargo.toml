[package]
name = "allsource-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "MIT"
repository = "https://github.com/all-source-os/chronos-monorepo"
homepage = "https://github.com/all-source-os/chronos-monorepo"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"

[dependencies]
# =============================================================================
# Arrow/Parquet - Columnar storage (Updated: 2025-12-05)
# Pin to minor version for stability, major updates quarterly
# =============================================================================
arrow = { version = "57.1", features = ["ipc", "json"] }
arrow-flight = "57.1"
datafusion = "51.0"
parquet = { version = "57.1", features = ["arrow", "async"] }

# =============================================================================
# Async runtime (Updated: 2025-12-05)
# Tokio 1.48 is current stable, 1.47.x is LTS until Sept 2026
# =============================================================================
async-trait = "0.1"  # Stable API, minimal changes
futures = "0.3"      # Stable API
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1" # Follows tokio versioning

# =============================================================================
# Web framework (Updated: 2025-12-05)
# Axum 0.8.x is stable, 0.9 in development
# =============================================================================
axum = { version = "0.8", features = ["json", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# =============================================================================
# Serialization (Updated: 2025-12-05)
# Stable APIs with long-term compatibility
# =============================================================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# =============================================================================
# Time handling (Updated: 2025-12-05)
# =============================================================================
chrono = { version = "0.4", features = ["serde"] }

# =============================================================================
# Logging & Tracing (Updated: 2025-12-05)
# =============================================================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# =============================================================================
# Utilities (Updated: 2025-12-05)
# =============================================================================
anyhow = "1.0"       # Stable error handling
thiserror = "2.0"    # Updated: v2.0 released 2024, stable API
uuid = { version = "1.19", features = ["v4", "serde"] }

# =============================================================================
# High-performance data structures (Updated: 2025-12-05)
# DashMap 6.x is stable, 7.0 is RC - stay on stable
# =============================================================================
crossbeam = "0.8"
crossbeam-queue = "0.3"
dashmap = "6.1"
parking_lot = "0.12"

# =============================================================================
# Compression (Updated: 2025-12-05)
# =============================================================================
flate2 = "1.0"
lz4 = "1.28"

# =============================================================================
# Checksums & Cryptography (Updated: 2025-12-05)
# =============================================================================
crc32fast = "1.4"
sha2 = "0.10"

# =============================================================================
# Metrics (Updated: 2025-12-05)
# =============================================================================
prometheus = "0.13"

# =============================================================================
# Schema validation (Updated: 2025-12-05)
# =============================================================================
jsonschema = "0.26"

# =============================================================================
# Authentication & Security (Updated: 2025-12-05)
# jsonwebtoken 10.0 requires explicit crypto backend
# =============================================================================
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
jsonwebtoken = "9.3"  # Stay on 9.x for now, 10.x has breaking changes
rand = "0.8"

# =============================================================================
# Database - Optional features (Updated: 2025-12-05)
# =============================================================================
rocksdb = { version = "0.22", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"], optional = true }

[features]
default = []
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]

[dev-dependencies]
criterion = "0.5"
ctrlc = "3.4"
tempfile = "3.23"

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true

[[example]]
name = "advanced_security_demo"
path = "examples/advanced_security_demo.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
