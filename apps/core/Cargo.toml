[package]
name = "allsource-core"
version = "0.7.3"
edition = "2021"
rust-version = "1.75"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "MIT"
repository = "https://github.com/all-source-os/chronos-monorepo"
homepage = "https://github.com/all-source-os/chronos-monorepo"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"

[dependencies]
# Note: arrow/parquet pinned to ~57.1 - version 57.2+ requires edition2024/Rust 1.85+
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
arrow = { version = "~57.1", features = ["ipc", "json"] }
arrow-flight = "~57.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
bumpalo = { version = "3.16", features = ["collections"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
crossbeam = "0.8"
crossbeam-queue = "0.3"
dashmap = "6.1"
datafusion = "~51.0"
flate2 = "1.0"
futures = "0.3"
http = "1.0"
jsonschema = "0.26"
jsonwebtoken = "9.3"
lz4 = "1.28"
parking_lot = "0.12"
parquet = { version = "~57.1", features = ["arrow", "async"] }
prometheus = "0.13"
rand = "0.8"
rocksdb = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simd-json = "0.14"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"], optional = true }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4", "serde"] }

[features]
default = []
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]

[dev-dependencies]
criterion = "0.5"
ctrlc = "3.4"
tempfile = "3.23"

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true

[[example]]
name = "advanced_security_demo"
path = "examples/advanced_security_demo.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
