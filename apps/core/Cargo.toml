[package]
name = "allsource-core"
version = "0.10.3"
edition = "2024"
rust-version = "1.92"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "MIT"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"
exclude = [".fastembed_cache/", "target/", "*.db", "data/"]

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"

[[bin]]
name = "allsource-sentinel"
path = "src/bin/allsource-sentinel.rs"

[features]
default = []
# DEPRECATED: Use event-sourced repositories (EventSourcedTenantRepository,
# EventSourcedAuditRepository) backed by AllSource's own WAL instead.
# This feature flag will be removed in a future release.
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]
vector-search = ["fastembed", "instant-distance"]
keyword-search = ["tantivy"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
# Note: arrow/parquet versions must be compatible with datafusion
arrow.workspace = true
arrow-flight.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bumpalo.workspace = true
# Security: bytes 1.11.1+ required for RUSTSEC-2026-0007
bytes.workspace = true
chrono.workspace = true
crc32fast.workspace = true
crossbeam.workspace = true
crossbeam-queue.workspace = true
dashmap.workspace = true
# Note: datafusion 51+ requires Rust 1.88+, pinned to 44.x for Rust 1.85 compatibility
datafusion.workspace = true
# Vector search dependencies (optional)
fastembed = { workspace = true, optional = true }
flate2.workspace = true
futures.workspace = true
hex = "0.4"
hmac = "0.12"
http.workspace = true
instant-distance = { workspace = true, optional = true }
jsonschema.workspace = true
jsonwebtoken.workspace = true
lz4.workspace = true
parking_lot.workspace = true
parquet.workspace = true
prometheus.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
simd-json.workspace = true
sqlx = { workspace = true, optional = true }
# Keyword search dependencies (optional)
tantivy = { workspace = true, optional = true }
thiserror.workspace = true
# Security: time 0.3.47+ required for RUSTSEC-2026-0009
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5"
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
ctrlc.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true
