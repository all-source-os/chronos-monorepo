[package]
name = "allsource-core"
version = "0.14.6"
edition = "2024"
rust-version = "1.92"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "MIT"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"
exclude = [".fastembed_cache/", "target/", "*.db", "data/"]

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"
required-features = ["server"]

[[bin]]
name = "allsource-sentinel"
path = "src/bin/allsource-sentinel.rs"
required-features = ["server"]

[features]
default = ["server", "analytics"]
# Embedded-only rlib size: ~30MB (includes arrow, parquet, serde, chrono; measured 2026-02-28)
# Server feature: includes HTTP server, auth, metrics, webhooks, and all infrastructure
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:argon2",
    "dep:aes-gcm",
    "dep:http",
]
# Analytics: DataFusion SQL engine for EventQL queries
analytics = ["dep:datafusion"]
# Arrow Flight protocol
flight = ["dep:arrow-flight"]
# DEPRECATED: Use event-sourced repositories instead.
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]
vector-search = ["fastembed", "instant-distance"]
keyword-search = ["tantivy"]
embedded = []
embedded-phase2 = ["embedded"]
embedded-sync = ["embedded", "dep:reqwest"]
embedded-replicant = ["embedded"]
embedded-streaming = ["embedded"]
embedded-projections = ["embedded"]
embedded-toon = ["embedded", "dep:toon-format"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
anyhow.workspace = true
argon2 = { workspace = true, optional = true }
# Note: arrow/parquet versions must be compatible with datafusion
arrow.workspace = true
arrow-flight = { workspace = true, optional = true }
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bumpalo.workspace = true
# Security: bytes 1.11.1+ required for RUSTSEC-2026-0007
bytes.workspace = true
chrono.workspace = true
crc32fast.workspace = true
crossbeam.workspace = true
crossbeam-queue.workspace = true
dashmap.workspace = true
datafusion = { workspace = true, optional = true }
# Vector search dependencies (optional)
fastembed = { workspace = true, optional = true }
flate2.workspace = true
futures.workspace = true
hex = "0.4"
hmac = "0.12"
http = { workspace = true, optional = true }
instant-distance = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
lz4.workspace = true
parking_lot.workspace = true
parquet.workspace = true
prometheus.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
rocksdb = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
simd-json.workspace = true
sqlx = { workspace = true, optional = true }
# Keyword search dependencies (optional)
tantivy = { workspace = true, optional = true }
thiserror.workspace = true
# Security: time 0.3.47+ required for RUSTSEC-2026-0009
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
toon-format = { version = "0.4", optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5"
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
ctrlc.workspace = true
tempfile.workspace = true
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true

[[test]]
name = "embedded_core_api"
path = "tests/embedded_core_api.rs"
required-features = ["embedded"]

[[test]]
name = "embedded_api_phase2"
path = "tests/embedded_api_phase2.rs"
required-features = ["embedded-phase2"]

[[test]]
name = "embedded_minimal_build"
path = "tests/embedded_minimal_build.rs"
required-features = ["embedded"]

[[test]]
name = "bidirectional_sync"
path = "tests/bidirectional_sync.rs"
required-features = ["embedded-sync"]

[[test]]
name = "http_sync_transport"
path = "tests/http_sync_transport.rs"
required-features = ["embedded-sync"]

[[test]]
name = "replicant_protocol"
path = "tests/replicant_protocol.rs"
required-features = ["embedded-replicant"]

[[test]]
name = "token_streaming"
path = "tests/token_streaming.rs"
required-features = ["embedded-streaming"]

[[test]]
name = "ai_projection_templates"
path = "tests/ai_projection_templates.rs"
required-features = ["embedded-projections"]

[[test]]
name = "mcp_tool_emission"
path = "tests/mcp_tool_emission.rs"
required-features = ["embedded-projections"]

[[test]]
name = "toon_format"
path = "tests/toon_format.rs"
required-features = ["embedded-toon"]
