[package]
name = "allsource-core"
version = "0.8.0"
edition = "2021"
rust-version = "1.92"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "MIT"
repository = "https://github.com/all-source-os/chronos-monorepo"
homepage = "https://github.com/all-source-os/chronos-monorepo"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"
exclude = [".fastembed_cache/", "target/", "*.db", "data/"]

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"

[features]
default = []
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]
vector-search = ["fastembed", "instant-distance"]
keyword-search = ["tantivy"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
arrow = { version = "53.4", features = ["ipc", "json"] }
arrow-flight = "53.4"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
bumpalo = { version = "3.16", features = ["collections"] }
# Note: arrow/parquet versions must be compatible with datafusion
# Security: bytes 1.11.1+ required for RUSTSEC-2026-0007
bytes = "1.11.1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
crossbeam = "0.8"
crossbeam-queue = "0.3"
dashmap = "6.1"
# Note: datafusion 51+ requires Rust 1.88+, pinned to 44.x for Rust 1.85 compatibility
datafusion = "44.0"

# Vector search dependencies (optional)
fastembed = { version = "4", optional = true }
flate2 = "1.0"
futures = "0.3"
http = "1.0"
instant-distance = { version = "0.6", optional = true }
jsonschema = "0.40"
jsonwebtoken = "9.3"
lz4 = "1.28"
parking_lot = "0.12"
parquet = { version = "53.4", features = ["arrow", "async"] }
prometheus = "0.14"
rand = "0.9"
rocksdb = { version = "0.24", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simd-json = "0.17"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"], optional = true }

# Keyword search dependencies (optional)
tantivy = { version = "0.22", optional = true }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"
ctrlc = "3.4"
tempfile = "3.23"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
