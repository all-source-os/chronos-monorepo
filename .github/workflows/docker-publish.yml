name: Docker Build & Publish

on:
  # Triggered automatically after Container CI workflow completes
  workflow_run:
    workflows: ["Container CI"]
    types: [completed]
    branches: [main]
  # Manual trigger for force builds
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all images"
        required: false
        default: "false"
        type: boolean
  # Tag pushes for releases
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Registry configuration
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_PREFIX: chronos

jobs:
  # ============================================================================
  # Check Container CI status (for workflow_run trigger)
  # ============================================================================
  check-container-ci:
    name: Check Container CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
    steps:
      - name: Check Container CI workflow conclusion
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Container CI workflow failed with: ${{ github.event.workflow_run.conclusion }}"
            echo "should_continue=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_continue=true" >> $GITHUB_OUTPUT

  # ============================================================================
  # Unified Push Conditions - Single source of truth for all registries
  # ============================================================================
  push-conditions:
    name: Evaluate Push Conditions
    runs-on: ubuntu-latest
    needs: check-container-ci
    if: |
      always() &&
      (github.event_name != 'workflow_run' || needs.check-container-ci.outputs.should_continue == 'true')
    outputs:
      # Unified condition: push to registries on main branch or version tags
      should_push: ${{ steps.conditions.outputs.should_push }}
      # Individual registry flags (both use same condition)
      push_to_ghcr: ${{ steps.conditions.outputs.push_to_ghcr }}
      push_to_dockerhub: ${{ steps.conditions.outputs.push_to_dockerhub }}
      # Image tag info
      is_release: ${{ steps.conditions.outputs.is_release }}
      version_tag: ${{ steps.conditions.outputs.version_tag }}
    steps:
      - name: Determine push conditions
        id: conditions
        run: |
          # Unified push condition: main branch OR version tags
          # This same logic applies to ALL registries for consistency
          IS_MAIN_BRANCH="${{ github.ref == 'refs/heads/main' }}"
          IS_VERSION_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"

          if [ "$IS_MAIN_BRANCH" == "true" ] || [ "$IS_VERSION_TAG" == "true" ]; then
            SHOULD_PUSH="true"
          else
            SHOULD_PUSH="false"
          fi

          # Both registries use the same push condition
          echo "should_push=$SHOULD_PUSH" >> $GITHUB_OUTPUT
          echo "push_to_ghcr=$SHOULD_PUSH" >> $GITHUB_OUTPUT
          echo "push_to_dockerhub=$SHOULD_PUSH" >> $GITHUB_OUTPUT
          echo "is_release=$IS_VERSION_TAG" >> $GITHUB_OUTPUT

          # Extract version from tag if present
          if [ "$IS_VERSION_TAG" == "true" ]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            echo "version_tag=" >> $GITHUB_OUTPUT
          fi

          # Log for debugging
          echo "Push conditions evaluated:"
          echo "  - Is main branch: $IS_MAIN_BRANCH"
          echo "  - Is version tag: $IS_VERSION_TAG"
          echo "  - Should push: $SHOULD_PUSH"

  # ============================================================================
  # Change Detection
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: push-conditions
    outputs:
      core: ${{ steps.filter.outputs.core }}
      control-plane: ${{ steps.filter.outputs.control-plane }}
      query-service: ${{ steps.filter.outputs.query-service }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
      # Matrix with service x arch combinations for native builds
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Services-only matrix for manifest creation
      services_matrix: ${{ steps.matrix.outputs.services_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'apps/core/**'
            control-plane:
              - 'apps/control-plane/**'
            query-service:
              - 'apps/query-service/**'
            mcp-server:
              - 'apps/mcp-server-elixir/**'

      - name: Build matrix
        id: matrix
        run: |
# Build matrix with service x architecture combinations
          # Each service is built on both amd64 and arm64 native runners
          MATRIX='{"include":['
          SERVICES_MATRIX='{"include":['
          FIRST=true
          SERVICES_FIRST=true

          add_service() {
            local name=$1
            local context=$2
            local changed=$3

            # Build if changed, on tag push, or force build
            if [ "$changed" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              # Add to services matrix (for manifest job)
              if [ "$SERVICES_FIRST" != "true" ]; then
                SERVICES_MATRIX="$SERVICES_MATRIX,"
              fi
              SERVICES_MATRIX="$SERVICES_MATRIX{\"name\":\"$name\",\"context\":\"$context\"}"
              SERVICES_FIRST=false

              # Add amd64 build
              if [ "$FIRST" != "true" ]; then
                MATRIX="$MATRIX,"
              fi
              MATRIX="$MATRIX{\"name\":\"$name\",\"context\":\"$context\",\"arch\":\"amd64\",\"runner\":\"ubuntu-latest\",\"platform\":\"linux/amd64\"}"
              FIRST=false

              # Add arm64 build
              MATRIX="$MATRIX,{\"name\":\"$name\",\"context\":\"$context\",\"arch\":\"arm64\",\"runner\":\"ubuntu-24.04-arm64\",\"platform\":\"linux/arm64\"}"
            fi
          }

          add_service "core" "apps/core" "${{ steps.filter.outputs.core }}"
          add_service "control-plane" "apps/control-plane" "${{ steps.filter.outputs.control-plane }}"
          add_service "query-service" "apps/query-service" "${{ steps.filter.outputs.query-service }}"
          add_service "mcp-server" "apps/mcp-server-elixir" "${{ steps.filter.outputs.mcp-server }}"

          MATRIX="$MATRIX]}"
          SERVICES_MATRIX="$SERVICES_MATRIX]}"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "services_matrix=$SERVICES_MATRIX" >> $GITHUB_OUTPUT
          echo "Build Matrix: $MATRIX"
          echo "Services Matrix: $SERVICES_MATRIX"

  # ============================================================================
  # Build and optionally push architecture-specific images (native builds)
  # Builds always run to validate Dockerfiles; push only when conditions are met
  # ============================================================================
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: [push-conditions, changes]
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    outputs:
      # Output digest for each service/arch combination
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GitHub Container Registry
        if: needs.push-conditions.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: needs.push-conditions.outputs.should_push == 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check DockerHub availability
        id: dockerhub-check
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "DockerHub credentials not configured, skipping DockerHub push"
          fi

      # Single metadata extraction step for all registries
      # Uses conditional image list based on DockerHub availability
      - name: Extract metadata for all registries
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/{1}/{2}-{3}', env.DOCKERHUB_REGISTRY, vars.DOCKERHUB_USERNAME, env.IMAGE_PREFIX, matrix.name) || '' }}
          # Push arch-specific tags that will be combined into manifest later
          tags: |
            type=raw,value=${{ matrix.arch }}-${{ github.sha }}

      - name: Build and optionally push arch-specific image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.push-conditions.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache with per-service, per-arch isolation to prevent cache thrashing
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ needs.push-conditions.outputs.should_push == 'true' && format('type=registry,ref={0}/{1}/{2}-{3}:buildcache-{4},mode=max', env.GHCR_REGISTRY, github.repository_owner, env.IMAGE_PREFIX, matrix.name, matrix.arch) || '' }}
          provenance: ${{ needs.push-conditions.outputs.should_push == 'true' }}
          sbom: ${{ needs.push-conditions.outputs.should_push == 'true' }}
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Report build success
        run: |
echo "### Build Successful: ${{ matrix.name }} (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.push-conditions.outputs.should_push }}" == "true" ]; then
            echo "Image pushed with digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image validated (push conditions not met)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # Create multi-arch manifests after all arch-specific images are pushed
  # ============================================================================
  manifest:
    name: Create Manifest ${{ matrix.name }}
    needs: [push-conditions, changes, build]
    if: |
      needs.changes.outputs.services_matrix != '{"include":[]}' &&
      needs.push-conditions.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.services_matrix) }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check DockerHub availability
        id: dockerhub-check
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for final tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest to GHCR
        id: manifest-ghcr
        run: |
          GHCR_IMAGE="${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}"
          AMD64_IMAGE="${GHCR_IMAGE}:amd64-${{ github.sha }}"
          ARM64_IMAGE="${GHCR_IMAGE}:arm64-${{ github.sha }}"

          # Process each tag from metadata
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            if [ -n "$TAG" ]; then
              echo "Creating manifest for: $TAG"
              docker buildx imagetools create -t "$TAG" "$AMD64_IMAGE" "$ARM64_IMAGE"
            fi
          done

          # Output the main image for attestation (use sha tag)
          echo "image=${GHCR_IMAGE}:sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Get manifest digest for attestation
        id: digest
        run: |
          GHCR_IMAGE="${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}"
          DIGEST=$(docker buildx imagetools inspect "${GHCR_IMAGE}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest to DockerHub
        if: steps.dockerhub-check.outputs.available == 'true'
        run: |
DOCKERHUB_IMAGE="${{ env.DOCKERHUB_REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}"
          AMD64_IMAGE="${DOCKERHUB_IMAGE}:amd64-${{ github.sha }}"
          ARM64_IMAGE="${DOCKERHUB_IMAGE}:arm64-${{ github.sha }}"

          # Generate DockerHub tags (same pattern as GHCR)
          # Branch tag
          if [[ "${{ github.ref_type }}" = "branch" ]]; then
            TAG="${DOCKERHUB_IMAGE}:${{ github.ref_name }}"
            docker buildx imagetools create -t "$TAG" "$AMD64_IMAGE" "$ARM64_IMAGE"
          fi

          # Version tags for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${VERSION}" "$AMD64_IMAGE" "$ARM64_IMAGE"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${VERSION%.*}" "$AMD64_IMAGE" "$ARM64_IMAGE"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${VERSION%%.*}" "$AMD64_IMAGE" "$ARM64_IMAGE"
          fi

          # SHA tag
          docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:sha-${GITHUB_SHA::7}" "$AMD64_IMAGE" "$ARM64_IMAGE"

          # Latest tag on main
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:latest" "$AMD64_IMAGE" "$ARM64_IMAGE"
          fi

      - name: Generate artifact attestation for GHCR
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Cleanup arch-specific tags from GHCR
        run: |
          # Note: GitHub doesn't provide an easy way to delete tags via CLI
          # The arch-specific tags will remain but won't be referenced
          echo "Multi-arch manifest created successfully"
          echo "Arch-specific tags (amd64-${{ github.sha }}, arm64-${{ github.sha }}) can be cleaned up manually if needed"

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [push-conditions, changes, build, manifest]
    if: always()
    steps:
      - name: Generate summary
        run: |
echo "## Docker Build & Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Push conditions info
          echo "### Push Conditions" >> "$GITHUB_STEP_SUMMARY"
          echo "| Condition | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Should Push | ${{ needs.push-conditions.outputs.should_push }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Push to GHCR | ${{ needs.push-conditions.outputs.push_to_ghcr }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Push to DockerHub | ${{ needs.push-conditions.outputs.push_to_dockerhub }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Is Release | ${{ needs.push-conditions.outputs.is_release }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Stage Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          # Report build stage status (unified build + conditional push)
          if [ "${{ needs.build.result }}" == "success" ]; then
            if [ "${{ needs.push-conditions.outputs.should_push }}" == "true" ]; then
              echo "| Build + Push (native amd64 + arm64) | Published |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| Build (native amd64 + arm64) | Validated |" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "| Build | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Build | Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Report manifest stage status
          if [ "${{ needs.manifest.result }}" == "success" ]; then
            echo "| Manifest (multi-arch) | Created |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Published Images" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Multi-arch manifests (linux/amd64 + linux/arm64) built with **native runners** (no QEMU emulation)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # GHCR images
            echo "**GitHub Container Registry (ghcr.io)**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ needs.changes.outputs.core }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/chronos-core" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${{ needs.changes.outputs.control-plane }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/chronos-control-plane" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${{ needs.changes.outputs.query-service }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/chronos-query-service" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${{ needs.changes.outputs.mcp-server }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/chronos-mcp-server" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**DockerHub** (if configured)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "docker.io/<username>/chronos-*" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

          elif [ "${{ needs.manifest.result }}" == "skipped" ]; then
            echo "| Manifest | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Manifest | Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail the summary if build failed
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Build stage failed - no images were pushed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Fail if manifest creation failed
          if [ "${{ needs.manifest.result }}" == "failure" ]; then
            exit 1
          fi
