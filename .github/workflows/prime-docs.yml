name: Build & Publish Prime API Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/core/src/prime/**'
      - 'apps/core/Cargo.toml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "prime-docs"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build docs
        run: |
          cd apps/core
          RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc \
            --no-deps \
            --features prime-recall,prime-vectors \
            --document-private-items
        env:
          CARGO_INCREMENTAL: 0

      - name: Add index redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=allsource_core/prime/index.html">' \
            > target/doc/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
