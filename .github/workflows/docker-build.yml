name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all images"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: allsource

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      control-plane: ${{ steps.filter.outputs.control-plane }}
      query-service: ${{ steps.filter.outputs.query-service }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
      prime: ${{ steps.filter.outputs.prime }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'apps/core/**'
            control-plane:
              - 'apps/control-plane/**'
            query-service:
              - 'apps/query-service/**'
            mcp-server:
              - 'apps/mcp-server-elixir/**'
            prime:
              - 'apps/prime-mcp/**'
              - 'apps/core/src/prime/**'

      - name: Build matrix
        id: matrix
        run: |
          MATRIX='{"include":['
          FIRST=true

          add_service() {
            local name=$1
            local context=$2
            local changed=$3
            local dockerfile=${4:-"$context/Dockerfile"}
            local target=${5:-""}
            local extra_args=${6:-""}

            if [ "$changed" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              if [ "$FIRST" != "true" ]; then
                MATRIX="$MATRIX,"
              fi
              MATRIX="$MATRIX{\"name\":\"$name\",\"context\":\"$context\",\"dockerfile\":\"$dockerfile\",\"target\":\"$target\",\"extra_args\":\"$extra_args\"}"
              FIRST=false
            fi
          }

          # Enterprise editions (default targets)
          add_service "core" "." "${{ steps.filter.outputs.core }}" "apps/core/Dockerfile" "runtime" ""
          add_service "control-plane" "apps/control-plane" "${{ steps.filter.outputs.control-plane }}"
          add_service "query-service" "apps/query-service" "${{ steps.filter.outputs.query-service }}" "" "" "ALLSOURCE_EDITION=enterprise"
          add_service "mcp-server" "apps/mcp-server-elixir" "${{ steps.filter.outputs.mcp-server }}"
          add_service "prime" "." "${{ steps.filter.outputs.prime }}" "apps/prime-mcp/Dockerfile" "runtime" ""
          # Community editions (public images)
          add_service "core-community" "." "${{ steps.filter.outputs.core }}" "apps/core/Dockerfile" "runtime-community" ""
          add_service "query-service-community" "apps/query-service" "${{ steps.filter.outputs.query-service }}" "" "" "ALLSOURCE_EDITION=community"

          MATRIX="$MATRIX]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Build Matrix: $MATRIX"

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            ${{ matrix.extra_args }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify-community-public:
    name: Verify -community packages are public
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      packages: read
    steps:
      - name: Check visibility of -community packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          packages=(allsource-core-community allsource-query-service-community)
          for pkg in "${packages[@]}"; do
            vis=$(gh api "/orgs/$owner/packages/container/$pkg" --jq .visibility 2>/dev/null || echo "missing")
            case "$vis" in
              public)
                echo "✅ $pkg is public"
                ;;
              private)
                echo "::warning title=Community package is private::ghcr.io/$owner/$pkg is published as private — README claims it's public. Flip at https://github.com/orgs/$owner/packages/container/$pkg/settings (Danger Zone → Change visibility → Public)."
                ;;
              missing)
                echo "::notice::Package $pkg has not been published yet — skipping visibility check."
                ;;
              *)
                echo "::warning::Unexpected visibility '$vis' for $pkg"
                ;;
            esac
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Docker Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "| Build | ✅ Published |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "| Build | ⏭️ Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Build | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform:** linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Images:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/allsource-core" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/allsource-control-plane" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/allsource-query-service" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/allsource-mcp-server" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
