# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "all-source-os/maintainers"

  # Rust (Core)
  - package-ecosystem: "cargo"
    directory: "/apps/core"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(rust)"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # Arrow/Parquet pinned to ~57.1 due to edition2024 requirements
      - dependency-name: "arrow"
        versions: [">=58.0.0"]
      - dependency-name: "parquet"
        versions: [">=58.0.0"]
      - dependency-name: "datafusion"
        versions: [">=52.0.0"]
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Go (Control Plane)
  - package-ecosystem: "gomod"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(go)"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # NPM/Bun (Web, packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(npm)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Mix (Query Service)
  - package-ecosystem: "mix"
    directory: "/apps/query-service"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(elixir)"
    labels:
      - "dependencies"
      - "elixir"

  # Mix (MCP Server)
  - package-ecosystem: "mix"
    directory: "/apps/mcp-server-elixir"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(elixir)"
    labels:
      - "dependencies"
      - "elixir"

  # Docker
  - package-ecosystem: "docker"
    directory: "/apps/core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/query-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
