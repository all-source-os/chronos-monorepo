# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
ignore = [
    # rsa 0.9.x timing side-channel (Marvin Attack). No fix available upstream.
    # Transitive via jsonwebtoken — not exposed to adaptive chosen-ciphertext.
    "RUSTSEC-2023-0071",

    # lz4_flex <0.11.6 memory leak on invalid data. Fixed in Cargo.lock (0.11.6).
    # Ignored for CI cache staleness.
    "RUSTSEC-2026-0041",

    # rustls-webpki <0.103.10 CRL matching bug. Fixed in Cargo.lock (0.103.10).
    "RUSTSEC-2026-0049",

    # astral-tokio-tar 0.5.x PAX extension validation (low severity: 1.7).
    # Transitive via testcontainers (dev-only). Waiting on upstream fix.
    "RUSTSEC-2026-0066",

    # tar <0.4.45 symlink chmod (medium) and PAX validation. Transitive via
    # testcontainers (dev-only). Fixed when testcontainers updates.
    "RUSTSEC-2026-0067",
    "RUSTSEC-2026-0068",
]
