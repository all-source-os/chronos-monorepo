# Google Cloud Run Service Configuration for AllSource Query Service
#
# Deploy:
#   gcloud run services replace deploy/cloudrun/query-service.yaml --region=us-central1
#
# Or with gcloud run deploy:
#   gcloud run deploy allsource-query-service \
#     --image gcr.io/PROJECT_ID/allsource-query-service:latest \
#     --region us-central1 \
#     --platform managed \
#     --allow-unauthenticated \
#     --memory 256Mi \
#     --cpu 1 \
#     --min-instances 0 \
#     --max-instances 20 \
#     --port 4000 \
#     --set-env-vars CORE_URL=https://allsource-core-HASH-uc.a.run.app

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: allsource-query-service
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Autoscaling settings - scale aggressively for queries
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        # CPU allocation only during request processing
        run.googleapis.com/cpu-throttling: "true"
        # Cold start optimization
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 200
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/allsource-query-service:latest
          ports:
            - containerPort: 4000
          env:
            - name: MIX_ENV
              value: "prod"
            - name: PHX_HOST
              value: "allsource-query-service.run.app"
            - name: CORE_URL
              value: "https://allsource-core-HASH-uc.a.run.app"  # Replace with actual Core URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: allsource-secrets
                  key: secret-key-base
            # PORT is automatically set by Cloud Run
          resources:
            limits:
              cpu: "1"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 30
