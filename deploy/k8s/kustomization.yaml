apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: allsource

resources:
  - namespace.yaml
  - core.yaml
  - query-service.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/version: "0.6.0"
    includeSelectors: true

images:
  - name: allsource/core
    newTag: "0.6.0"
  - name: allsource/query-service
    newTag: "0.6.0"
