{{- if .Values.queryService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos.queryService.fullname" . }}
  labels:
    {{- include "chronos.queryService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.queryService.service.type }}
  ports:
    - port: {{ .Values.queryService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chronos.queryService.selectorLabels" . | nindent 4 }}
{{- end }}
