{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chronos.fullname" . }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "chronos.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- if .Values.core.enabled }}
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      targetPort: {{ .Values.core.config.port }}
    {{- end }}
    {{- if .Values.queryService.enabled }}
    - port: http
      path: /api/metrics
      interval: {{ .Values.serviceMonitor.interval }}
      targetPort: {{ .Values.queryService.service.port }}
    {{- end }}
{{- end }}
