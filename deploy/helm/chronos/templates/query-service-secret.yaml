{{- if .Values.queryService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chronos.queryService.fullname" . }}-secrets
  labels:
    {{- include "chronos.queryService.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.queryService.config.secretKeyBase }}
  secret-key-base: {{ .Values.queryService.config.secretKeyBase | b64enc | quote }}
  {{- else }}
  # Generate a random secret key base if not provided
  secret-key-base: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
