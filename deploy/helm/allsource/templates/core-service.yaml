{{- if .Values.core.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "allsource.core.fullname" . }}
  labels:
    {{- include "allsource.core.labels" . | nindent 4 }}
spec:
  type: {{ .Values.core.service.type }}
  ports:
    - port: {{ .Values.core.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.core.service.wsPort }}
      targetPort: websocket
      protocol: TCP
      name: websocket
  selector:
    {{- include "allsource.core.selectorLabels" . | nindent 4 }}
{{- end }}
