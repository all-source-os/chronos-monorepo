{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "allsource.fullname" . }}
  labels:
    {{- include "allsource.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "core" }}
                name: {{ include "allsource.core.fullname" $ }}
                port:
                  number: {{ $.Values.core.service.httpPort }}
                {{- else if eq .service "queryService" }}
                name: {{ include "allsource.queryService.fullname" $ }}
                port:
                  number: {{ $.Values.queryService.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
