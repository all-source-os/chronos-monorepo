{{- if and .Values.core.enabled .Values.core.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "allsource.core.fullname" . }}-data
  labels:
    {{- include "allsource.core.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.core.persistence.accessMode }}
  {{- if or .Values.core.persistence.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.core.persistence.storageClass | default .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.core.persistence.size }}
{{- end }}
