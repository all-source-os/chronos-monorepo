[workspace]
resolver = "3"
members = [
    "apps/core",
    "apps/mcp-server-elixir/native/core_nif",
    "sdks/rust",
    "tooling/performance",
]
exclude = [
    "apps/chronis",
    "apps/registry",
    "crates/better-auth-allsource",
]

[workspace.dependencies]

# Security & Crypto
aes-gcm = "0.10"

# AllFrame web framework
allframe = "0.1"
# Internal crates
allsource-core = { path = "apps/core" }

# Error handling
anyhow = "1.0"
argon2 = "0.5"

# Data / Arrow / Parquet
arrow = { version = "57.3", features = ["ipc", "json"] }
arrow-flight = "57.3"
async-trait = "0.1"

# Web framework
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bumpalo = { version = "3.20", features = ["collections"] }
bytes = "1.11.1"

# Common utilities
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"

# Dev / Test
criterion = "0.8"
crossbeam = "0.8"
crossbeam-queue = "0.3"
crossterm = "0.28"
ctrlc = "3.5"

# Storage & Concurrency
dashmap = "6.1"
datafusion = "52.1"

# Optional features
fastembed = { version = "5" }

# Compression
flate2 = "1.0"
futures = "0.3"
http = "1.0"
instant-distance = { version = "0.6" }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
lz4 = "1.28"
parking_lot = "0.12"
parquet = { version = "57.3", features = ["arrow", "async"] }
prometheus = "0.14"
rand = "0.10"
ratatui = "0.29"
rocksdb = { version = "0.24" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simd-json = "0.17"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }
tabled = "0.17"
tantivy = { version = "0.25" }
tempfile = "3.23"
thiserror = "2.0"
time = "0.3.47"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
toml = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
